services:
  livetrigger-app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: livetrigger-ai
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
      - PORT=3000
      - JWT_SECRET=${JWT_SECRET:?Es obligatorio definir JWT_SECRET en el archivo .env}
      - ADMIN_USERNAME=${ADMIN_USERNAME:-admin}
      - ADMIN_EMAIL=${ADMIN_EMAIL:-admin@livetrigger.local}
      - ADMIN_PASSWORD=${ADMIN_PASSWORD:?Es obligatorio definir ADMIN_PASSWORD en el archivo .env (minimo 10 caracteres)}
      - TIKTOK_WEBHOOK_SECRET=${TIKTOK_WEBHOOK_SECRET:-}
      - EULER_STREAM_API_KEY=${EULER_STREAM_API_KEY:-}
      - DATA_DIR=/app/data
    volumes:
      - livetrigger_data:/app/data
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:3000/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s

volumes:
  livetrigger_data:
    driver: local
